<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eadfcc">
  <title>Verificar recibo | Lorena Cruz Beauty Studio</title>
  <link rel="icon" type="image/png" href="assets/images/brand/lc-icono.png">
  <link rel="apple-touch-icon" href="assets/images/brand/lc-icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============ COLORES Y TIPOGRAFÍAS (mismos que el resto del sitio) ============ */
    :root {
      --marfil: #eadfcc;
      --lino: #dfd1b9;
      --oro-fino: #a3845a;
      --bronce: #664e30;
      --cafe: #44392e;
      --suave: #574b3e;
      --tenue: #5f5242;
      --tinta: #17120e;
      --papel: #f6f0e4;
      --linea: rgba(23, 18, 14, .15);
      --linea-2: rgba(23, 18, 14, .34);
      --ok: #2a5a38;
      --rojo: #85342a;
      --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, 'Times New Roman', serif;
      --sans: 'Jost', 'Helvetica Neue', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --suave-e: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; font-family: var(--sans); font-size: 15.5px; line-height: 1.55;
      background: linear-gradient(180deg, var(--lino) 0%, var(--marfil) 60%); color: var(--cafe);
      -webkit-font-smoothing: antialiased; font-variant-numeric: lining-nums;
    }
    h1 { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 1.12; color: var(--tinta); }
    :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

    .pagina { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
    .logo { width: 64px; height: auto; display: block; margin: 0 auto 18px; }
    .eyebrow { display: block; font: 500 11px/1.2 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--bronce); }
    .tarjeta { position: relative; background: var(--papel); border: 1px solid var(--linea); padding: 30px 22px 24px; text-align: center; }
    .tarjeta::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--linea); pointer-events: none; }
    @media (min-width: 600px) { .tarjeta { padding: 38px 34px 30px; } }
    .tarjeta h1 { font-size: 32px; margin: 12px 0 8px; }
    .nota { color: var(--suave); font-size: 14.5px; margin: 0 auto; max-width: 42ch; }

    .sello { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 6px 12px; font: 500 11px/1.3 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
    .sello svg { width: 16px; height: 16px; }
    .sello.ok { background: rgba(47, 93, 61, .1); color: var(--ok); }
    .sello.mal { background: rgba(143, 58, 48, .1); color: var(--rojo); }

    .aviso-anulado { margin: 18px 0 0; padding: 12px 14px; background: #f6e4e0; border: 1px solid rgba(143, 58, 48, .5); color: #6f2a22; font-size: 14.5px; text-align: left; }

    .datos { margin: 22px 0 0; text-align: left; border-top: 1px solid var(--linea); }
    .datos > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 16px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
    .datos dt { font: 500 10.5px/1.4 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); }
    .datos dd { margin: 0; color: var(--tinta); font-weight: 500; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums lining-nums; }
    .datos .monto dd { font: 400 26px/1.2 var(--serif); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; margin-top: 22px; padding: 0 24px;
      border: 1px solid var(--tinta); border-radius: 0; background: var(--tinta); color: var(--marfil);
      font: 500 12px/1.3 var(--sans); letter-spacing: .22em; text-transform: uppercase; cursor: pointer;
      transition: background .35s var(--suave-e), color .35s var(--suave-e); -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: transparent; color: var(--tinta); }

    .cargando { display: inline-block; width: 22px; height: 22px; margin-top: 14px; border-radius: 50%; border: 1.5px solid var(--bronce); border-right-color: transparent; animation: girar .8s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cargando { animation-duration: 3s; } }

    .pie { text-align: center; color: var(--tenue); font-size: 12.5px; padding: 22px 16px 0; }

    /* ============ IMPRESIÓN (A4, sin botones) ============ */
    @page { size: A4; margin: 18mm; }
    @media print {
      body { background: #fff; color: #000; font-size: 11pt; }
      .pagina { max-width: none; padding: 0; }
      .no-imprimir { display: none !important; }
      .logo { width: 56px; }
      .tarjeta { border: 1px solid #999; padding: 12mm 10mm; break-inside: avoid; }
      .tarjeta::before { display: none; }
      .tarjeta h1 { font-size: 24pt; }
      .sello, .aviso-anulado { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .datos > div { border-bottom-color: #ccc; }
      .pie { color: #444; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <img class="logo" src="assets/images/brand/lc-monograma-oscuro.png" alt="" width="144" height="124" onerror="this.remove()">
    <section class="tarjeta" aria-live="polite">
      <span class="eyebrow">Verificación de recibo</span>
      <h1 id="titulo">Verificando…</h1>

      <div id="cargando"><span class="cargando" aria-hidden="true"></span></div>

      <div id="error" hidden>
        <span class="sello mal" id="selloError"></span>
        <p class="nota" id="textoError"></p>
      </div>

      <div id="recibo" hidden>
        <span class="sello" id="sello"></span>
        <p class="aviso-anulado" id="avisoAnulado" hidden>Este recibo fue anulado. No tiene validez como comprobante de pago.</p>
        <dl class="datos">
          <div><dt>Código</dt><dd id="rCodigo"></dd></div>
          <div><dt>Fecha de emisión</dt><dd id="rFecha"></dd></div>
          <div><dt>Período</dt><dd id="rPeriodo"></dd></div>
          <div><dt>Concepto</dt><dd id="rConcepto"></dd></div>
          <div class="monto"><dt>Monto</dt><dd id="rMonto"></dd></div>
          <div><dt>Emisor</dt><dd id="rEmisor"></dd></div>
        </dl>
        <button class="btn no-imprimir" type="button" id="imprimir">Imprimir / Guardar como PDF</button>
      </div>
    </section>
    <p class="pie">Lorena Cruz Beauty Studio · Sistema creado por Fox &amp; Co. Digital</p>
  </main>

  <script>
    // Misma base y misma clave pública que usa el resto del sitio (index.html y admin.html)
    const SUPABASE_URL = "https://hjusdqjtqqszktuvvdqu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gC-yvOsKKTsDa52cTj6ZQA__Lspinxi";
    const EMISOR = "Fox & Co. Digital";

    const $ = id => document.getElementById(id);

    function icono(trazo) {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 24 24");
      s.setAttribute("fill", "none");
      s.setAttribute("stroke", "currentColor");
      s.setAttribute("stroke-width", "1.8");
      s.setAttribute("stroke-linecap", "round");
      s.setAttribute("stroke-linejoin", "round");
      s.setAttribute("aria-hidden", "true");
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", trazo);
      s.appendChild(p);
      return s;
    }
    function sello(nodo, clase, texto, trazo) {
      nodo.className = "sello " + clase;
      nodo.replaceChildren(icono(trazo), document.createTextNode(texto));
    }
    const CHECK = "M5 12.5l4.5 4.5L19 7.5";
    const CRUZ = "M6 6l12 12M18 6L6 18";

    function fecha(v) {
      if (!v) return "—";
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
      const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(v);
      return isNaN(d) ? String(v) : d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
    }
    function monto(n, moneda) {
      if (n === null || n === undefined || n === "") return "—";
      try { return Number(n).toLocaleString("es-AR", { style: "currency", currency: moneda || "ARS" }); }
      catch (e) { return (moneda ? moneda + " " : "$") + Number(n).toLocaleString("es-AR"); }
    }

    function noVerificado(texto) {
      $("cargando").hidden = true;
      $("recibo").hidden = true;
      $("titulo").textContent = "No pudimos verificar este recibo";
      sello($("selloError"), "mal", "Sin verificar", CRUZ);
      $("textoError").textContent = texto;
      $("error").hidden = false;
    }

    function mostrar(d) {
      $("cargando").hidden = true;
      $("titulo").textContent = d.anulado ? "Recibo anulado" : "Recibo auténtico";
      if (d.anulado) sello($("sello"), "mal", "Anulado", CRUZ);
      else sello($("sello"), "ok", "Verificado", CHECK);
      $("avisoAnulado").hidden = !d.anulado;
      $("rCodigo").textContent = d.codigo || "—";
      $("rFecha").textContent = fecha(d.fecha);
      $("rPeriodo").textContent = d.periodo || "—";
      $("rConcepto").textContent = d.concepto || "—";
      $("rMonto").textContent = monto(d.monto, d.moneda);
      $("rEmisor").textContent = d.emisor || EMISOR;
      $("recibo").hidden = false;
      document.title = (d.anulado ? "Recibo anulado" : "Recibo " + (d.codigo || "")) + " | Lorena Cruz Beauty Studio";
    }

    async function verificar() {
      const q = new URLSearchParams(location.search);
      const codigo = (q.get("c") || "").trim();
      const clave = (q.get("k") || "").trim();
      if (!codigo || !clave) { noVerificado("Al enlace le faltan datos. Abrilo de nuevo desde el recibo original."); return; }
      try {
        const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/recibo_verificar", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
          body: JSON.stringify({ p_codigo: codigo, p_token: clave })
        });
        if (!r.ok) throw new Error("verificar " + r.status);
        let d = await r.json();
        if (Array.isArray(d)) d = d[0];
        if (!d || (d.valido !== true && d.anulado !== true)) { noVerificado("El recibo no existe o el enlace no es correcto."); return; }
        mostrar(d);
      } catch (e) {
        noVerificado("No hay conexión o el servicio no respondió. Probá de nuevo en un rato.");
      }
    }

    $("imprimir").onclick = function () { window.print(); };
    verificar();
  </script>
</body>
</html>
